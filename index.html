<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT Editorial App</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .highlight-word { display: inline-block; transition: all 0.2s ease; }
        .highlight-word:hover { color: #2563eb; background-color: #eff6ff; border-radius: 0.25rem; padding: 0 0.25rem; margin: 0 -0.25rem; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .exporting-pdf .no-print { display: none !important; }
        .exporting-pdf { background-color: white !important; }
        .exporting-pdf #content-to-export { padding: 0 !important; margin: 0 !important; max-width: none !important; width: 100% !important; }
        .exporting-pdf table { width: 100% !important; border-collapse: collapse; }
        .exporting-pdf td, .exporting-pdf th { word-wrap: break-word !important; white-space: normal !important; }
        
        @keyframes pulse-ring { 0% { transform: scale(.33); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 80%, 100% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } }
        .loading-ring { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ d, size=24, cls="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={cls} dangerouslySetInnerHTML={{__html: d}} />
        );
        
        const icons = {
            Book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
            Menu: '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
            X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
            Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
            Calendar: '<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>',
            Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
            Brain: '<path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 3 3 0 0 0 .34 5.58 2.5 2.5 0 0 0 2.96 3.08 2.5 2.5 0 0 0 4.91.05L12 20V4.5Z"/><path d="M16 8V5c0-1.1.9-2 2-2"/><path d="M12 13h4"/><path d="M12 17h6"/><path d="M12 9h6"/><path d="M18 13v-1"/><path d="M18 17v-1"/>',
            File: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/>',
            Lang: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
            Loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
            Vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'
        };

        const FALLBACK_DATA = [{
            id: "fallback-1",
            date: new Date().toISOString().split('T')[0],
            title: "Analyzing the Indian Express Data Fetch",
            content: "Currently waiting for the GitHub Actions bot to fetch the actual data. If you see this, either the bot is currently running, or the JSON data returned an error. Check the GitHub Actions tab.",
            theme: "System Setup", readTime: "1 min", centralIdea: "The system is waiting for Python bot data.", tone: "Informative",
            skimming: ["Wait for bot to finish.", "Refresh the page."],
            vocab: [{word: "Fetch", english: "Go for and then bring back", gujarati: "લાવવું", pos: "Verb"}],
            idioms: []
        }];

        function App() {
            const [articles, setArticles] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [selectedId, setSelectedId] = useState(null);
            
            const [view, setView] = useState('editorial');
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth >= 768);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [dictResult, setDictResult] = useState(null);
            const [isSearching, setIsSearching] = useState(false);
            const [showDictModal, setShowDictModal] = useState(false);
            const [exporting, setExporting] = useState(false);

            useEffect(() => {
                const fetchEditorials = async () => {
                    setIsLoading(true);
                    try {
                        // Crash-proof fetching with anti-cache headers
                        const response = await fetch('./data.json?t=' + new Date().getTime(), {
                            cache: 'no-store',
                            headers: {
                                'Cache-Control': 'no-cache, no-store, must-revalidate',
                                'Pragma': 'no-cache',
                                'Expires': '0'
                            }
                        });
                        
                        if (!response.ok) throw new Error('Data not found');
                        
                        const data = await response.json();
                        
                        if (!Array.isArray(data) || data.length === 0) {
                            throw new Error('Data is empty');
                        }

                        // Add safe fallbacks to every article to prevent white screen crashes
                        const safeData = data.map((a, i) => ({
                            ...a,
                            id: a.id || `gen-${i}`,
                            title: a.title || "Untitled Article",
                            content: a.content || "No content available.",
                            skimming: Array.isArray(a.skimming) ? a.skimming : [],
                            vocab: Array.isArray(a.vocab) ? a.vocab : [],
                            idioms: Array.isArray(a.idioms) ? a.idioms : []
                        }));

                        setArticles(safeData);
                        setSelectedId(safeData[0].id);
                    } catch (error) {
                        console.log("Using fallback data due to error:", error);
                        setArticles(FALLBACK_DATA);
                        setSelectedId(FALLBACK_DATA[0].id);
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchEditorials();

                const handleResize = () => setIsSidebarOpen(window.innerWidth >= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const handleSearch = async (wordToSearch) => {
                const word = wordToSearch || searchQuery;
                if (!word.trim()) return;
                
                setIsSearching(true);
                setShowDictModal(true);
                setSearchQuery(word);

                const allVocab = articles.flatMap(a => a.vocab || []);
                const localMatch = allVocab.find(v => (v.word || "").toLowerCase() === word.toLowerCase().trim());

                if (localMatch) {
                    setDictResult({
                        word: localMatch.word,
                        meanings: [{
                            partOfSpeech: localMatch.pos || "",
                            definitions: [{ definition: localMatch.english || "", gujarati: localMatch.gujarati || "" }],
                            synonyms: localMatch.synonyms ? localMatch.synonyms.split(', ') : [],
                            antonyms: localMatch.antonyms ? localMatch.antonyms.split(', ') : []
                        }]
                    });
                    setIsSearching(false);
                    return;
                }

                try {
                    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.trim()}`);
                    if (!res.ok) throw new Error('Not found');
                    const data = await res.json();
                    setDictResult({ word: data[0].word, phonetic: data[0].phonetic, meanings: data[0].meanings });
                } catch {
                    setDictResult({ error: "Word not found in dictionary or check your spelling." });
                } finally {
                    setIsSearching(false);
                }
            };

            const handleWordSelection = () => {
                setTimeout(() => {
                    let text = window.getSelection().toString().trim().replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g, '');
                    if (text && /^[a-zA-Z]+$/.test(text) && !text.includes(' ')) handleSearch(text);
                }, 100);
            };

            const renderHighlightedText = (text, vocabList) => {
                if (!vocabList || vocabList.length === 0 || !text) return text;
                const words = vocabList.map(v => v.word).filter(Boolean);
                if (words.length === 0) return text;
                
                const regex = new RegExp(`\\b(${words.join('|')})\\b`, 'gi');
                return text.split(regex).map((part, i) => {
                    const isVocab = words.some(w => w.toLowerCase() === part.toLowerCase());
                    return isVocab ? (
                        <strong key={i} onClick={() => handleSearch(part)} className="font-bold text-slate-900 cursor-pointer highlight-word relative z-10">{part}</strong>
                    ) : part;
                });
            };

            const downloadPDF = () => {
                if (!window.html2pdf) return alert("PDF library loading, try again.");
                setExporting(true);
                document.body.classList.add('exporting-pdf');
                
                window.html2pdf().set({
                    margin: [10, 10, 15, 10], filename: 'CAT_Editorial.pdf', image: {type: 'jpeg', quality: 0.98},
                    html2canvas: {scale: 2}, jsPDF: {unit: 'mm', format: 'a4', orientation: 'portrait'}
                }).from(document.getElementById('content-to-export')).save().then(() => {
                    setExporting(false);
                    document.body.classList.remove('exporting-pdf');
                }).catch(() => {
                    setExporting(false);
                    document.body.classList.remove('exporting-pdf');
                });
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <div className="relative flex items-center justify-center w-24 h-24 mb-6">
                            <div className="absolute w-full h-full rounded-full border-4 border-blue-100"></div>
                            <div className="absolute w-full h-full rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
                            <div className="loading-ring absolute bg-white rounded-full p-2"><Icon d={icons.Book} size={32} cls="text-blue-600"/></div>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800">Fetching Editorials</h2>
                    </div>
                );
            }

            const currentArticle = articles.find(a => a.id === selectedId) || articles[0] || FALLBACK_DATA[0];

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="no-print sticky top-0 bg-white border-b border-slate-200 shadow-sm px-4 py-3 flex justify-between items-center z-40">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 text-slate-500 hover:text-blue-600 bg-slate-100 rounded-md">
                                <Icon d={isSidebarOpen ? icons.X : icons.Menu} />
                            </button>
                            <h1 className="text-xl md:text-2xl font-bold text-blue-900 flex items-center gap-2">
                                <Icon d={icons.Book} cls="text-blue-600 hidden sm:block" /> CAT<span className="text-slate-800">Editorial</span>
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('editorial')} className={`px-3 py-2 text-sm font-medium rounded-md ${view === 'editorial' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Read</button>
                            <button onClick={() => setView('vocab')} className={`px-3 py-2 text-sm font-medium rounded-md ${view === 'vocab' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-600'}`}>Vocab</button>
                        </div>
                    </header>

                    <div className="flex flex-1">
                        <aside className={`no-print fixed top-[61px] left-0 w-72 h-[calc(100vh-61px)] bg-white border-r border-slate-200 overflow-y-auto p-4 transition-transform duration-300 z-30 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-5 flex items-center gap-2">
                                <Icon d={icons.Calendar} size={14}/> History
                            </h2>
                            <div className="space-y-2">
                                {articles.map(a => (
                                    <button 
                                        key={a.id} 
                                        onClick={() => { setSelectedId(a.id); if(window.innerWidth<768) setIsSidebarOpen(false); setView('editorial'); }}
                                        className={`w-full text-left px-3 py-2.5 rounded-lg text-sm block border ${selectedId === a.id ? 'bg-blue-50 border-blue-200 text-blue-800 font-medium' : 'border-transparent text-slate-600 hover:bg-slate-50'}`}
                                    >
                                        <div className="text-xs opacity-70 mb-1">{a.date || "Unknown Date"}</div>
                                        <div className="line-clamp-2 leading-snug">{a.title}</div>
                                    </button>
                                ))}
                            </div>
                        </aside>

                        {isSidebarOpen && <div className="md:hidden fixed inset-0 top-[61px] bg-slate-900/20 z-20 backdrop-blur-sm no-print" onClick={() => setIsSidebarOpen(false)}/>}

                        <main id="content-to-export" className={`flex-1 w-full bg-white p-4 md:p-8 transition-all duration-300 ${isSidebarOpen ? 'md:ml-72' : 'ml-0'}`}>
                            
                            {}
                            {view === 'editorial' && currentArticle && (
                                <div className="max-w-4xl mx-auto">
                                    <div className="no-print bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6 flex items-start gap-3 text-amber-800 text-sm">
                                        <Icon d={icons.Vol} size={20} cls="shrink-0 mt-0.5 text-amber-600"/>
                                        <p><strong>Pro Tip:</strong> Select/double-click any word to view its meaning.</p>
                                    </div>

                                    <div className="flex justify-between items-center mb-4 no-print">
                                        <span className="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold uppercase rounded-full">{currentArticle.theme || "Editorial"}</span>
                                        <button onClick={downloadPDF} disabled={exporting} className="flex items-center gap-1 bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm font-medium disabled:opacity-70">
                                            <Icon d={exporting ? icons.Loader : icons.Download} size={16} cls={exporting ? "animate-spin" : ""}/> {exporting ? 'Saving...' : 'Save PDF'}
                                        </button>
                                    </div>
                                    
                                    <h1 className="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight mb-6">{currentArticle.title}</h1>
                                    
                                    <div className="grid md:grid-cols-2 gap-6 mb-8">
                                        <div className="bg-indigo-50/50 p-5 rounded-xl border border-indigo-100">
                                            <h3 className="font-bold text-indigo-900 mb-2 flex items-center gap-2"><Icon d={icons.Brain} size={18}/> Central Idea</h3>
                                            <p className="text-sm text-indigo-800/90">{currentArticle.centralIdea || "Not available."}</p>
                                        </div>
                                        <div className="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100">
                                            <h3 className="font-bold text-emerald-900 mb-2 flex items-center gap-2"><Icon d={icons.File} size={18}/> Tone</h3>
                                            <p className="text-sm text-emerald-800/90">{currentArticle.tone || "Not available."}</p>
                                        </div>
                                    </div>

                                    {currentArticle.skimming && currentArticle.skimming.length > 0 && (
                                        <div className="mb-10 bg-white rounded-xl border border-slate-200 p-6">
                                            <h3 className="text-lg font-bold border-b border-slate-100 pb-2 mb-4 flex items-center gap-2"><Icon d={icons.Search} size={20} cls="text-blue-500"/> Skimming Points</h3>
                                            <ul className="list-disc pl-5 space-y-2 text-slate-700">
                                                {currentArticle.skimming.map((point, idx) => <li key={idx}>{point}</li>)}
                                            </ul>
                                        </div>
                                    )}

                                    <div className="prose prose-lg text-slate-800 leading-loose mb-12 text-justify font-serif tracking-wide" onMouseUp={handleWordSelection} onTouchEnd={handleWordSelection}>
                                        <p>{renderHighlightedText(currentArticle.content, currentArticle.vocab)}</p>
                                    </div>

                                    {currentArticle.vocab && currentArticle.vocab.length > 0 && (
                                        <div className="mb-10">
                                            <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Icon d={icons.Lang} size={22} cls="text-indigo-500"/> Vocabulary</h3>
                                            <div className="overflow-x-auto rounded-xl border border-slate-200">
                                                <table className="w-full text-left border-collapse">
                                                    <thead><tr className="bg-slate-50 text-slate-600 text-xs uppercase"><th className="p-4">Word</th><th className="p-4">English</th><th className="p-4">Gujarati</th></tr></thead>
                                                    <tbody className="divide-y divide-slate-100 text-sm">
                                                        {currentArticle.vocab.map((v, i) => (
                                                            <tr key={i} className="hover:bg-slate-50">
                                                                <td className="p-4 font-bold">{v.word}</td>
                                                                <td className="p-4">{v.english}</td>
                                                                <td className="p-4 text-indigo-700 font-medium">{v.gujarati}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {view === 'vocab' && (
                                <div className="max-w-5xl mx-auto">
                                    <h2 className="text-3xl font-extrabold text-slate-900 mb-6">Vocab Bank</h2>
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                                        <table className="w-full text-left border-collapse">
                                            <thead><tr className="bg-slate-50 text-slate-600 text-xs uppercase"><th className="p-4">Date</th><th className="p-4">Word</th><th className="p-4">English</th><th className="p-4">Gujarati</th></tr></thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {articles.flatMap(a => (a.vocab || []).map(v => ({...v, date: a.date}))).map((v, i) => (
                                                    <tr key={i} className="hover:bg-slate-50">
                                                        <td className="p-4 text-xs text-slate-400 whitespace-nowrap">{v.date}</td>
                                                        <td className="p-4 font-bold">{v.word}</td>
                                                        <td className="p-4">{v.english}</td>
                                                        <td className="p-4 text-indigo-700 font-medium">{v.gujarati}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {showDictModal && (
                        <div className="no-print fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="p-4 border-b border-slate-100 flex gap-3">
                                    <input type="text" className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 outline-none" value={searchQuery} onChange={(e)=>setSearchQuery(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&handleSearch()}/>
                                    <button onClick={()=>handleSearch()} className="bg-blue-600 text-white px-4 py-2 rounded-lg">Find</button>
                                    <button onClick={()=>setShowDictModal(false)} className="p-2 text-slate-400 hover:text-slate-700"><Icon d={icons.X} size={20}/></button>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 bg-slate-50/50">
                                    {isSearching ? <div className="text-center text-slate-400 py-10"><Icon d={icons.Loader} cls="animate-spin mx-auto mb-2" size={32}/>Searching...</div>
                                    : dictResult ? (
                                        dictResult.error ? <div className="text-center text-rose-600 bg-rose-50 p-4 rounded-xl">{dictResult.error}</div> : (
                                            <div>
                                                <h2 className="text-3xl font-extrabold capitalize mb-4">{dictResult.word}</h2>
                                                {(dictResult.meanings || []).map((m, idx) => (
                                                    <div key={idx} className="bg-white p-5 rounded-xl border border-slate-100 shadow-sm mb-4">
                                                        <span className="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-2 py-1 rounded">{m.partOfSpeech}</span>
                                                        <ul className="list-disc pl-5 mt-4 space-y-2 text-slate-700">
                                                            {m.definitions.map((d, i) => (
                                                                <li key={i}>{d.definition} {d.gujarati && <div className="text-indigo-700 mt-1 text-sm">Gujarati: {d.gujarati}</div>}</li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                ))}
                                            </div>
                                        )
                                    ) : <div className="text-center text-slate-400 py-10">Type a word to find its meaning.</div>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
