name: Daily Editorial Fetcher

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main 
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Yahan beautifulsoup4 aur lxml add kiya gaya hai web scraping ke liye
          pip install requests google-generativeai beautifulsoup4 lxml

      - name: Run Backend Updater Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend_updater.py

      - name: Commit and push changes (data.json)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add -f data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real news editorials [skip ci]" && git push)
```eof

---

### 2. Update `backend_updater.py` (Real Web Scraper)
Ye raha aapka naya Python code. Ye Indian Express ke Editorials section se latest articles layega, unke paragraph text ko scrape karega, aur Gemini AI ko bhej dega.

Isko copy karke apne `backend_updater.py` me pura replace kar dein:

```python:backend_updater.py
import os
import json
import time
import requests
from bs4 import BeautifulSoup
import google.generativeai as genai
from datetime import datetime, timedelta

# ==========================================
# 1. SECURE CONFIGURATION (USING ENV VARIABLES)
# ==========================================
GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")

if not GEMINI_API_KEY:
    raise ValueError("GEMINI_API_KEY is missing! Please set it in GitHub Secrets.")

genai.configure(api_key=GEMINI_API_KEY)

# Use the fast and cheap flash model
generation_config = {
    "temperature": 0.3, 
    "response_mime_type": "application/json", 
}
model = genai.GenerativeModel(
    model_name="gemini-1.5-flash", 
    generation_config=generation_config
)

# ==========================================
# 2. AI PROMPT DESIGN
# ==========================================
SYSTEM_PROMPT = """
You are an expert English language instructor preparing students for the CAT (Common Admission Test) exam in India.
I will provide you with a news editorial. You must analyze it and return a strict JSON object with the following structure:
{
    "centralIdea": "A 1-2 sentence summary of the main point.",
    "tone": "2-3 words describing the author's tone (e.g., Analytical, Critical, Optimistic).",
    "skimming": ["Point 1", "Point 2", "Point 3", "Point 4"],
    "grammar": "A brief explanation of one interesting grammatical structure found in the text.",
    "vocab": [
        {
            "word": "difficult_word",
            "english": "English meaning",
            "gujarati": "Meaning in Gujarati script",
            "pos": "Noun/Verb/Adjective",
            "synonyms": "syn1, syn2",
            "antonyms": "ant1, ant2"
        }
    ],
    "idioms": [
        {
            "idiom": "idiom used in text",
            "meaning": "english meaning",
            "gujarati": "Gujarati meaning"
        }
    ]
}
Extract 4-5 difficult vocabulary words. If there are no idioms, leave the list empty.
"""

# ==========================================
# 3. REAL WEB SCRAPING LOGIC
# ==========================================
def fetch_latest_editorials():
    print("Fetching live editorials from The Indian Express...")
    articles = []
    
    # 1. RSS feed URL for Indian Express Editorials
    rss_url = "https://indianexpress.com/section/opinion/editorials/feed/"
    headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'}
    
    try:
        response = requests.get(rss_url, headers=headers, timeout=10)
        soup = BeautifulSoup(response.content, 'xml')
        
        # Get the top 2 latest articles
        items = soup.find_all('item')[:2]
        
        for item in items:
            title = item.title.text
            link = item.link.text
            print(f"Scraping link: {link}")
            
            # 2. Visit the actual article link to scrape paragraphs
            art_resp = requests.get(link, headers=headers, timeout=10)
            art_soup = BeautifulSoup(art_resp.content, 'html.parser')
            
            paragraphs = art_soup.find_all('p')
            
            # 3. Clean up the text (ignore short lines or ads)
            content_pieces = []
            for p in paragraphs:
                text = p.text.strip()
                # Filter out standard ad/promo texts
                if len(text) > 60 and "Click here" not in text and "Also Read" not in text:
                    content_pieces.append(text)
            
            full_content = " ".join(content_pieces)
            
            # Limit to ~800 words to save AI processing tokens & ensure CAT length
            words = full_content.split()
            if len(words) > 800:
                full_content = " ".join(words[:800]) + "..."
                
            if full_content:
                articles.append({
                    "title": title,
                    "content": full_content,
                    "theme": "Current Affairs / Editorial"
                })
                
    except Exception as e:
        print(f"Error fetching live news: {e}")
        
    return articles

def process_article_with_ai(article):
    """Sends the article to Gemini AI to get CAT-level analysis in JSON format."""
    print(f"Sending to AI: {article['title']}")
    
    prompt = f"Article Title: {article['title']}\n\nContent:\n{article['content']}"
    
    try:
        response = model.generate_content(SYSTEM_PROMPT + "\n\n" + prompt)
        ai_analysis = json.loads(response.text)
        
        return {
            "id": f"art-{int(time.time())}-{hash(article['title']) % 10000}",
            "date": datetime.now().strftime("%Y-%m-%d"),
            "title": article["title"],
            "content": article["content"],
            "theme": article["theme"],
            "readTime": f"{max(1, len(article['content'].split()) // 200)} min", 
            **ai_analysis 
        }
    except Exception as e:
        print(f"Error AI processing '{article['title']}': {e}")
        return None

# ==========================================
# 4. DATABASE MANAGEMENT
# ==========================================
def update_database():
    db_file = "data.json"
    
    if os.path.exists(db_file):
        with open(db_file, "r", encoding="utf-8") as f:
            try:
                database = json.load(f)
            except json.JSONDecodeError:
                database = []
    else:
        database = []

    # Fetch Real News
    new_articles_raw = fetch_latest_editorials()
    
    if not new_articles_raw:
        print("No articles fetched. Check web scraper.")
        return

    new_articles_processed = []
    for raw_article in new_articles_raw:
        # Check if we already have this article based on title to avoid duplicates
        is_duplicate = any(db_art.get("title") == raw_article["title"] for db_art in database)
        if not is_duplicate:
            processed = process_article_with_ai(raw_article)
            if processed:
                new_articles_processed.append(processed)
                time.sleep(2) # Avoid rate limits
        else:
            print(f"Skipping duplicate: {raw_article['title']}")

    # Merge and save
    database = new_articles_processed + database

    thirty_days_ago = datetime.now() - timedelta(days=30)
    database = [
        art for art in database 
        if datetime.strptime(art["date"], "%Y-%m-%d") >= thirty_days_ago
    ]

    with open(db_file, "w", encoding="utf-8") as f:
        json.dump(database, f, ensure_ascii=False, indent=4)
        
    print(f"Successfully added {len(new_articles_processed)} articles. Total articles in DB: {len(database)}")

if __name__ == "__main__":
    print(f"Starting live daily editorial fetch for {datetime.now().strftime('%Y-%m-%d')}")
    update_database()
