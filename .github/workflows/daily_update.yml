name: Daily Editorial Fetcher

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # FORCES the bot to look at the 'main' branch
          fetch-depth: 0

      - name: DEBUG - What files are here?
        run: |
          echo "I am currently in this folder:"
          pwd
          echo "Here are all the files I can see:"
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run Backend Updater Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend_updater.py

      - name: Commit and push changes (data.json)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add -f data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily editorials [skip ci]" && git push)
