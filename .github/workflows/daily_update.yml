name: Daily Editorial Fetcher

on:

Run automatically every day at 6:00 AM UTC (approx 11:30 AM IST)

schedule:
- cron: '0 6 * * *'

Allow manual trigger from the GitHub Actions tab

workflow_dispatch:

jobs:
update-data:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests google-generativeai

  - name: Run Backend Updater Script
    env:
      # This pulls the secret key you save in GitHub Secrets safely
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python backend_updater.py

  - name: Commit and push changes (data.json)
    run: |
      git config --global user.name 'GitHub Actions Bot'
      git config --global user.email 'actions@github.com'
      git add data.json
      # Only commit if data.json has changed
      git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily editorials [skip ci]" && git push)
